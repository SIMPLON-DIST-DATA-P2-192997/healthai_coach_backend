tags:
- name: auth
  description: Registration and login (JWT issuance).
- name: users
  description: The authenticated user's own profile.
- name: admin
  description: Admin-only user management (list/read/update/delete any user).
- name: food-items
  description: Food catalog, fed by the nutrition ETL. Readable by anyone, writable
    by admins only.
- name: nutrition-logs
  description: The authenticated user's logged meals (what they ate, when, how much).
- name: exercises
  description: Exercise catalog, fed by the exercises ETL. Readable by anyone, writable
    by admins only.
- name: workouts
  description: The authenticated user's workout sessions and the sets performed within
    them.
