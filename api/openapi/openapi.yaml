        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Resolved
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DataQualityLogRead'
                title: Response List Logs Api V1 Data Quality Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - data-quality
      summary: Report a data quality anomaly
      description: Create a new data quality log entry (admin only). Typically called
        by the ETL pipeline when a validation rule fails.
      operationId: create_log_api_v1_data_quality_post
      security:
      - OAuth2PasswordBearer: []
      requestBody:
        required: true
