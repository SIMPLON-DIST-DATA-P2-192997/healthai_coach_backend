openapi: 3.1.0
info:
  title: HealthAI API
  description: '

    REST API for HealthAI Coach: user accounts, nutrition logging, workout tracking,

    biometrics, health profiles (medical/dietary/fitness) and diet recommendations.


    Data model reference: `database/schema/modele_donnees.md` (MCD/MLD) and

    `database/schema/ddl_postgres.sql` (MPD) — the physical schema backing these

    endpoints.


    Authentication: `POST /auth/login` returns a JWT bearer token (OAuth2 password

    flow). Send it as `Authorization: Bearer <token>` on subsequent requests.

    Most `/health-profiles`, `/nutrition-logs`, `/workouts` and `/biometrics`

    endpoints operate on the authenticated user''s own data; catalog endpoints

    (`/food-items`, `/exercises`) are readable by anyone but writable by admins

    only; `/admin` and `/data-quality` are admin-only.

    '
  version: 0.1.0
paths:
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Log in
      description: Authenticate with email + password, receive a JWT access token.
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Body_login_api_v1_auth_login_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/register:
    post:
      tags:
      - auth
      summary: Register
      description: Register a new user account.
      operationId: register_api_v1_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/users/me:
    get:
      tags:
      - users
      summary: Get my profile
      description: Return the currently authenticated user's profile.
      operationId: read_current_user_api_v1_users_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
      security:
      - OAuth2PasswordBearer: []
    put:
      tags:
      - users
      summary: Update my profile
      description: Update the currently authenticated user's own profile.
      operationId: update_current_user_api_v1_users_me_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/admin/users:
    get:
      tags:
      - admin
      summary: List all users
      description: List all users (admin only).
      operationId: list_users_api_v1_admin_users_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: skip
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Skip
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserRead'
                title: Response List Users Api V1 Admin Users Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/users/{user_id}:
    get:
      tags:
      - admin
      summary: Get a user
      description: Get a specific user by ID (admin only).
      operationId: read_user_api_v1_admin_users__user_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
          title: User Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - admin
      summary: Update a user
      description: Update any user's data or role (admin only).
      operationId: update_user_admin_api_v1_admin_users__user_id__put
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
          title: User Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserAdminUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - admin
      summary: Delete a user
      description: Delete a user (admin only).
      operationId: delete_user_admin_api_v1_admin_users__user_id__delete
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
          title: User Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/food-items:
    get:
      tags:
      - food-items
      summary: List food items
      description: List the food catalog (public), fed by the nutrition ETL. Paginated
        with `skip`/`limit`.
      operationId: list_food_items_api_v1_food_items_get
      parameters:
      - name: skip
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Skip
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FoodItemRead'
                title: Response List Food Items Api V1 Food Items Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - food-items
      summary: Create a food item
      description: Add a new food item to the catalog (admin only). `(source, external_id)`
        must be unique.
      operationId: create_food_item_endpoint_api_v1_food_items_post
      security:
      - OAuth2PasswordBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FoodItemCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodItemRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/food-items/{food_item_id}:
    get:
      tags:
      - food-items
      summary: Get a food item
      description: Return a single food item from the catalog (public).
      operationId: read_food_item_api_v1_food_items__food_item_id__get
      parameters:
      - name: food_item_id
        in: path
        required: true
        schema:
          type: integer
          title: Food Item Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodItemRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - food-items
      summary: Update a food item
      description: Update a food item in the catalog (admin only).
      operationId: update_food_item_endpoint_api_v1_food_items__food_item_id__put
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: food_item_id
        in: path
        required: true
        schema:
          type: integer
          title: Food Item Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FoodItemUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodItemRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - food-items
      summary: Delete a food item
      description: Delete a food item from the catalog (admin only). Fails if nutrition
        logs still reference it (ON DELETE RESTRICT).
      operationId: delete_food_item_endpoint_api_v1_food_items__food_item_id__delete
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: food_item_id
        in: path
        required: true
        schema:
          type: integer
          title: Food Item Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/nutrition-logs:
    get:
      tags:
      - nutrition-logs
      summary: List my nutrition logs
      description: Return the authenticated user's logged meals, most recent first.
      operationId: list_my_nutrition_logs_api_v1_nutrition_logs_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: skip
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Skip
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NutritionLogRead'
                title: Response List My Nutrition Logs Api V1 Nutrition Logs Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - nutrition-logs
      summary: Log a meal
      description: Record that the authenticated user consumed a given quantity of
        a food item. `meal_type` must be one of breakfast, lunch, dinner, snack. Defaults
        `logged_at` to now if omitted.
      operationId: create_my_nutrition_log_api_v1_nutrition_logs_post
      security:
      - OAuth2PasswordBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NutritionLogCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NutritionLogRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/nutrition-logs/{log_id}:
    get:
      tags:
      - nutrition-logs
      summary: Get a nutrition log
      description: Return a single logged meal owned by the authenticated user.
      operationId: read_nutrition_log_api_v1_nutrition_logs__log_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: log_id
        in: path
        required: true
        schema:
          type: integer
          title: Log Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NutritionLogRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - nutrition-logs
      summary: Update a nutrition log
      description: Partially update a logged meal owned by the authenticated user.
      operationId: update_my_nutrition_log_api_v1_nutrition_logs__log_id__put
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: log_id
        in: path
        required: true
        schema:
          type: integer
          title: Log Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NutritionLogUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NutritionLogRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - nutrition-logs
      summary: Delete a nutrition log
      description: Delete a logged meal owned by the authenticated user.
      operationId: delete_my_nutrition_log_api_v1_nutrition_logs__log_id__delete
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: log_id
        in: path
        required: true
        schema:
          type: integer
          title: Log Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/exercises:
    get:
      tags:
      - exercises
      summary: List exercises
      description: List the exercise catalog (public). Paginated with `skip`/`limit`.
      operationId: list_exercises_api_v1_exercises_get
      parameters:
      - name: skip
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Skip
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExerciseRead'
                title: Response List Exercises Api V1 Exercises Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - exercises
      summary: Create an exercise
      description: Add a new exercise to the catalog (admin only).
      operationId: create_exercise_endpoint_api_v1_exercises_post
      security:
      - OAuth2PasswordBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExerciseCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/exercises/{exercise_id}:
    get:
      tags:
      - exercises
      summary: Get an exercise
      description: Return a single exercise from the catalog (public).
      operationId: read_exercise_api_v1_exercises__exercise_id__get
      parameters:
      - name: exercise_id
        in: path
        required: true
        schema:
          type: integer
          title: Exercise Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - exercises
      summary: Update an exercise
      description: Update an exercise in the catalog (admin only).
      operationId: update_exercise_endpoint_api_v1_exercises__exercise_id__put
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: exercise_id
        in: path
        required: true
        schema:
          type: integer
          title: Exercise Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExerciseUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - exercises
      summary: Delete an exercise
      description: Delete an exercise from the catalog (admin only). Fails if workout
        sets still reference it (ON DELETE RESTRICT).
      operationId: delete_exercise_endpoint_api_v1_exercises__exercise_id__delete
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: exercise_id
        in: path
        required: true
        schema:
          type: integer
          title: Exercise Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/workouts:
    get:
      tags:
      - workouts
      summary: List my workout sessions
      description: Return the authenticated user's workout sessions, most recent first.
      operationId: list_my_sessions_api_v1_workouts_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: skip
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Skip
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkoutSessionRead'
                title: Response List My Sessions Api V1 Workouts Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - workouts
      summary: Start a workout session
      description: Create a new workout session for the authenticated user.
      operationId: create_my_session_api_v1_workouts_post
      security:
      - OAuth2PasswordBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkoutSessionCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutSessionRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/workouts/{session_id}:
    get:
      tags:
      - workouts
      summary: Get a workout session
      description: Return a single workout session owned by the authenticated user.
      operationId: read_my_session_api_v1_workouts__session_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: integer
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutSessionRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - workouts
      summary: Update a workout session
      description: Partially update a workout session owned by the authenticated user
        (e.g. set `ended_at` once finished).
      operationId: update_my_session_api_v1_workouts__session_id__put
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: integer
          title: Session Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkoutSessionUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutSessionRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - workouts
      summary: Delete a workout session
      description: Delete a workout session owned by the authenticated user. Cascades
        to delete its workout sets.
      operationId: delete_my_session_api_v1_workouts__session_id__delete
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: integer
          title: Session Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/workouts/{session_id}/sets:
    get:
      tags:
      - workouts
      summary: List sets in a workout session
      description: Return all sets recorded in a workout session owned by the authenticated
        user.
      operationId: list_sets_api_v1_workouts__session_id__sets_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: integer
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkoutSetRead'
                title: Response List Sets Api V1 Workouts  Session Id  Sets Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - workouts
      summary: Record a set
      description: Add a set (exercise + reps/weight/duration/distance) to a workout
        session owned by the authenticated user. `(session_id, exercise_id, set_number)`
        must be unique — this is the resolution of the workout_sessions x exercises
        N,N association, tracked at set granularity to allow progression tracking
        over time.
      operationId: create_set_endpoint_api_v1_workouts__session_id__sets_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: integer
          title: Session Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkoutSetCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutSetRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/workouts/{session_id}/sets/{set_id}:
    put:
      tags:
      - workouts
      summary: Update a set
      description: Partially update a set within a workout session owned by the authenticated
        user.
      operationId: update_set_endpoint_api_v1_workouts__session_id__sets__set_id__put
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: integer
          title: Session Id
      - name: set_id
        in: path
        required: true
        schema:
          type: integer
          title: Set Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkoutSetUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutSetRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - workouts
      summary: Delete a set
