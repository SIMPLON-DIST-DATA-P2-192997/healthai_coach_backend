# Sprint 6 : postgres, db-init (migrations + seed + vues KPI), admin_interface
# et metabase sont complets. api et airflow restent en stub commenté, en
# attente des Dockerfile des équipes concernées (Rôle C pour l'API, équipe
# ETL/Airflow pour l'orchestration).
# Objectif Sprint 6 : `docker compose up` -> environnement fonctionnel en < 30 min
# (une seule commande : postgres démarre, db-init peuple la base une fois
# postgres prêt, puis admin_interface/metabase démarrent avec des données
# déjà en place — cf. docs/guide_deploiement.md).
version: "3.9"

services:
  postgres:
    image: postgres:16
    env_file: .env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-init:
    build:
      context: .
      dockerfile: database/bootstrap/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy

  admin_interface:
    build:
      context: .
      dockerfile: admin_interface/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "${ADMIN_INTERFACE_PORT}:7860"
    depends_on:
      db-init:
        condition: service_completed_successfully

  metabase:
    image: metabase/metabase:latest
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: ${METABASE_DB_NAME}
      MB_DB_PORT: ${METABASE_DB_PORT}
      MB_DB_USER: ${METABASE_DB_USER}
      MB_DB_PASS: ${METABASE_DB_PASSWORD}
      MB_DB_HOST: ${METABASE_DB_HOST}
    ports:
      - "${METABASE_PORT}:3000"
    depends_on:
      db-init:
        condition: service_completed_successfully

  # api:
  #   Sprint 4 (Rôle C). Pas de Dockerfile côté api/ pour le moment —
  #   à ajouter ici une fois fourni par l'équipe API (variables déjà
  #   prévues dans .env.example : API_HOST, API_PORT, JWT_*).

  # airflow (webserver + scheduler):
  #   Orchestration Sprint 3, hors périmètre Rôle A — à compléter par
  #   l'équipe ETL/Airflow une fois leurs DAGs stabilisés (variables déjà
  #   prévues dans .env.example : AIRFLOW__*).

volumes:
  postgres_data:
