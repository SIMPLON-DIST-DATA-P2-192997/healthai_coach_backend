# Sprint 6 : tous les services sont complets (postgres, db-init, api,
# admin_interface, metabase, airflow).
# Objectif Sprint 6 : `docker compose up` -> environnement fonctionnel en < 30 min
# (une seule commande : postgres démarre, db-init peuple la base une fois
# postgres prêt, puis admin_interface/metabase/airflow démarrent avec des
# données déjà en place — cf. docs/guide_deploiement.md).
version: "3.9"

# Config commune aux 3 services Airflow (webserver/scheduler/init), reprise
# du patron officiel Airflow (x-airflow-common) pour éviter de dupliquer
# l'environnement/volumes trois fois. Choix LocalExecutor + Postgres partagé
# (base "airflow" dédiée dessus, cf. database/init/02_create_airflow_db.sql)
# plutôt que CeleryExecutor+Redis+Postgres dédié : un DAG unique (cf. rapport,
# section Pipeline ETL) ne justifie pas la complexité de plusieurs workers, et
# la machine de démo n'a pas la RAM pour 7 services Airflow en plus du reste
# de la stack applicative.
x-airflow-common:
  &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
  env_file: .env
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    PYTHONPATH: /opt/airflow
    DATABASE_URL: ${DATABASE_URL}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./etl:/opt/airflow/etl
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    db-init:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16
    env_file: .env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-init:
    build:
      context: .
      dockerfile: database/bootstrap/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    depends_on:
      postgres:
        condition: service_healthy

  admin_interface:
    build:
      context: .
      dockerfile: admin_interface/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "${ADMIN_INTERFACE_PORT}:7860"
    depends_on:
      db-init:
        condition: service_completed_successfully

  metabase:
    image: metabase/metabase:latest
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: ${METABASE_DB_NAME}
      MB_DB_PORT: ${METABASE_DB_PORT}
      MB_DB_USER: ${METABASE_DB_USER}
      MB_DB_PASS: ${METABASE_DB_PASSWORD}
      MB_DB_HOST: ${METABASE_DB_HOST}
    ports:
      - "${METABASE_PORT}:3000"
    depends_on:
      db-init:
        condition: service_completed_successfully

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES}
    ports:
      - "${API_PORT}:8000"
    depends_on:
      db-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    entrypoint: /entrypoint
    command: airflow version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_UPGRADE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
    user: "0:0"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "${AIRFLOW_PORT}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
